<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Multi-Router WAN — Network Topology</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#555">NovaTech — HQ / Branch01 / Branch02 via Core-R backbone (static routing)</text>

  <!-- Router icons (simple rounded rect) helper style -->
  <!-- HQ-R -->
  <rect x="70" y="230" width="120" height="60" rx="8" fill="#1BA0D7" stroke="#0d5c7d" stroke-width="2"/>
  <text x="130" y="256" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">HQ-R</text>
  <text x="130" y="274" text-anchor="middle" font-size="11" fill="#eaf7ff">2621XM</text>

  <!-- Core-R -->
  <rect x="340" y="230" width="120" height="60" rx="8" fill="#2E4057" stroke="#16202b" stroke-width="2"/>
  <text x="400" y="256" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Core-R</text>
  <text x="400" y="274" text-anchor="middle" font-size="11" fill="#dfe6ee">2811 (transit)</text>

  <!-- Branch01-R -->
  <rect x="610" y="230" width="130" height="60" rx="8" fill="#1BA0D7" stroke="#0d5c7d" stroke-width="2"/>
  <text x="675" y="256" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Branch01-R</text>
  <text x="675" y="274" text-anchor="middle" font-size="11" fill="#eaf7ff">2621XM</text>

  <!-- Branch02-R -->
  <rect x="890" y="230" width="130" height="60" rx="8" fill="#1BA0D7" stroke="#0d5c7d" stroke-width="2"/>
  <text x="955" y="256" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Branch02-R</text>
  <text x="955" y="274" text-anchor="middle" font-size="11" fill="#eaf7ff">2621XM</text>

  <!-- WAN links -->
  <line x1="190" y1="260" x2="340" y2="260" stroke="#c0392b" stroke-width="3"/>
  <text x="265" y="248" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Link1</text>
  <text x="265" y="298" text-anchor="middle" font-size="10" fill="#444">10.0.0.0/30</text>

  <line x1="460" y1="260" x2="610" y2="260" stroke="#c0392b" stroke-width="3"/>
  <text x="535" y="248" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Link2</text>
  <text x="535" y="298" text-anchor="middle" font-size="10" fill="#444">10.0.0.4/30</text>

  <line x1="740" y1="260" x2="890" y2="260" stroke="#c0392b" stroke-width="3"/>
  <text x="815" y="248" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Link3</text>
  <text x="815" y="298" text-anchor="middle" font-size="10" fill="#444">10.0.0.8/30</text>

  <!-- DCE markers -->
  <text x="330" y="222" text-anchor="middle" font-size="10" fill="#c0392b">DCE</text>
  <text x="200" y="222" text-anchor="middle" font-size="10" fill="#2c3e50">DTE</text>
  <text x="470" y="222" text-anchor="middle" font-size="10" fill="#c0392b">DCE</text>
  <text x="600" y="222" text-anchor="middle" font-size="10" fill="#2c3e50">DTE</text>
  <text x="750" y="222" text-anchor="middle" font-size="10" fill="#c0392b">DCE</text>
  <text x="880" y="222" text-anchor="middle" font-size="10" fill="#2c3e50">DTE</text>

  <!-- HQ LAN branch -->
  <line x1="130" y1="230" x2="130" y2="130" stroke="#27ae60" stroke-width="2"/>
  <rect x="30" y="70" width="200" height="60" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="130" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e6b3e">HQ-Staff LAN</text>
  <text x="130" y="108" text-anchor="middle" font-size="10" fill="#333">172.16.0.0/29</text>
  <text x="130" y="122" text-anchor="middle" font-size="10" fill="#333">PC0 (.2) · PC1 (.3)</text>

  <!-- HQ Server Farm -->
  <line x1="150" y1="290" x2="150" y2="390" stroke="#8e44ad" stroke-width="2"/>
  <rect x="50" y="390" width="200" height="60" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="150" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b2c6f">HQ-Server-Farm</text>
  <text x="150" y="428" text-anchor="middle" font-size="10" fill="#333">172.16.1.0/30</text>
  <text x="150" y="442" text-anchor="middle" font-size="10" fill="#333">Server0 (.2)</text>

  <!-- Branch01 LAN -->
  <line x1="675" y1="290" x2="675" y2="390" stroke="#27ae60" stroke-width="2"/>
  <rect x="575" y="390" width="200" height="60" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e6b3e">Branch01-LAN</text>
  <text x="675" y="428" text-anchor="middle" font-size="10" fill="#333">172.16.0.8/29</text>
  <text x="675" y="442" text-anchor="middle" font-size="10" fill="#333">PC2 (.10) · PC3 (.11)</text>

  <!-- Branch02 LAN -->
  <line x1="955" y1="290" x2="955" y2="390" stroke="#27ae60" stroke-width="2"/>
  <rect x="855" y="390" width="200" height="60" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="955" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e6b3e">Branch02-LAN</text>
  <text x="955" y="428" text-anchor="middle" font-size="10" fill="#333">172.16.0.16/29</text>
  <text x="955" y="442" text-anchor="middle" font-size="10" fill="#333">PC4 (.18) · PC5 (.19)</text>

  <!-- Legend -->
  <rect x="70" y="500" width="1060" height="90" rx="6" fill="#f9f9f9" stroke="#ddd"/>
  <text x="90" y="522" font-size="12" font-weight="bold" fill="#333">Legend</text>
  <line x1="90" y1="538" x2="120" y2="538" stroke="#c0392b" stroke-width="3"/>
  <text x="128" y="542" font-size="11" fill="#333">WAN Serial Link (Static Route)</text>
  <line x1="90" y1="558" x2="120" y2="558" stroke="#27ae60" stroke-width="2"/>
  <text x="128" y="562" font-size="11" fill="#333">LAN Segment</text>
  <line x1="90" y1="578" x2="120" y2="578" stroke="#8e44ad" stroke-width="2"/>
  <text x="128" y="582" font-size="11" fill="#333">Server Farm (dedicated interface/subnet)</text>
  <text x="500" y="542" font-size="11" fill="#333">DCE = clock source (Core-R on Link1/2, Branch01-R on Link3)</text>
  <text x="500" y="562" font-size="11" fill="#333">Branch01-R plays a dual role: own LAN + transit for Branch02-R</text>
  <text x="500" y="582" font-size="11" fill="#333">Core-R is transit-only (no directly attached LAN)</text>
</svg>
